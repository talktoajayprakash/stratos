name: Safe PR Echo

on:
  pull_request:
    types: [opened, edited]

permissions:
  contents: read

jobs:
  echo-title:
    runs-on: ubuntu-latest
    steps:
      - name: Echo title through quoted environment variable
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE"
