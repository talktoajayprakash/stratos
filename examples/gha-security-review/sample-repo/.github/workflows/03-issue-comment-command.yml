name: Version Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/version')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge
      - name: Run version script from the PR
        run: ./scripts/version.sh
