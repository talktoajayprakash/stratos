name: Dangerous PR Target

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  test-fork-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout attacker PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install fork dependencies
        run: npm ci
      - name: Run fork tests
        run: npm test
