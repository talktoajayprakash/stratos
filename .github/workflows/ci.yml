name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
        node: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["24", "26"]' || '["24"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Google JavaScript and TypeScript style
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run lint
      - name: Unit and integration tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm test
      - name: Unit and integration tests
        if: matrix.os != 'ubuntu-latest' || matrix.node != '24'
        run: |
          npm run build
          node --test dist/test/unit/*.test.js dist/test/integration/*.test.js
